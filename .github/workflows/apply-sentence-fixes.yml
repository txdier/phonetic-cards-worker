name: Apply sentence fixes

on:
  push:
    branches:
      - fix/stable-fast-sentence-translation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply deterministic test and cache-version fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'src/translation-api.js',
              "export const TRANSLATION_RULES_VERSION = 'sentence-v1';",
              "export const TRANSLATION_RULES_VERSION = 'sentence-v2-fast';"
          )

          replace_once(
              'tests/reader-pending-dom.test.js',
              "  const firstRequest = deferred();\n  const attempts = new Map();",
              "  const firstRequest = deferred();\n  const secondRequest = deferred();\n  const attempts = new Map();"
          )

          replace_once(
              'tests/reader-pending-dom.test.js',
              "        if (body.sentenceIndex === 0 && attempts.get(0) === 1) return firstRequest.promise;\n        return {\n          ...body,\n          translation: body.sentenceIndex === 0 ? '第一句重试。' : '第二句。',\n          cached: false\n        };",
              "        if (body.sentenceIndex === 0 && attempts.get(0) === 1) return firstRequest.promise;\n        if (body.sentenceIndex === 1 && attempts.get(1) === 1) {\n          return secondRequest.promise.then(() => ({\n            ...body,\n            translation: '第二句。',\n            cached: false\n          }));\n        }\n        return {\n          ...body,\n          translation: body.sentenceIndex === 0 ? '第一句重试。' : '第二句。',\n          cached: false\n        };"
          )

          replace_once(
              'tests/reader-pending-dom.test.js',
              "    await waitFor(\n      () => attempts.get(0) === 1\n        && attempts.get(1) === 1\n        && slots[1].dataset.state === 'translated',\n      'independent sentence POST should finish before rejecting the first request'\n    );",
              "    await waitFor(\n      () => attempts.get(0) === 1 && attempts.get(1) === 1,\n      'both sentence POST requests should start independently'\n    );\n    secondRequest.resolve();\n    await waitFor(\n      () => slots[1].dataset.state === 'translated',\n      'resolved independent sentence POST should reach translated state'\n    );"
          )
          PY

      - name: Commit the permanent fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-sentence-fixes.yml
          git add src/translation-api.js tests/reader-pending-dom.test.js
          git commit -m "Stabilize sentence translation concurrency test"
          git push
