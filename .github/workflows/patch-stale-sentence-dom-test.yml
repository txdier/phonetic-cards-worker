name: Patch stale sentence DOM test

on:
  push:
    branches:
      - fix/translation-response-shapes
    paths:
      - .github/workflows/patch-stale-sentence-dom-test.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/translation-response-shapes
          persist-credentials: true

      - name: Patch stale node assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/reader-pending-dom.test.js')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "&& slots[1].dataset.state === 'translated',",
                  """&& env.root.querySelectorAll(
                    '[data-role=\"sentence-translation-slot\"]'
                  )[1]?.dataset.state === 'translated',"""
              ),
              (
                  """    assert.equal(attempts.get(0), 1);
    assert.equal(attempts.get(1), 1);
    assert.equal(slots[1].dataset.state, 'translated');""",
                  """    slots = env.root.querySelectorAll('[data-role=\"sentence-translation-slot\"]');
    assert.equal(attempts.get(0), 1);
    assert.equal(attempts.get(1), 1);
    assert.equal(slots[1].dataset.state, 'translated');"""
              ),
              (
                  "() => slots[0].dataset.state === 'error',",
                  """() => env.root.querySelectorAll(
                '[data-role=\"sentence-translation-slot\"]'
              )[0]?.dataset.state === 'error',"""
              ),
              (
                  "() => attempts.get(0) === 2 && slots[0].dataset.state === 'translated',",
                  """() => attempts.get(0) === 2 && env.root.querySelectorAll(
                '[data-role=\"sentence-translation-slot\"]'
              )[0]?.dataset.state === 'translated',"""
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one match, found {count}: {old!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/patch-stale-sentence-dom-test.yml').unlink()
          PY

      - name: Commit repaired test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/reader-pending-dom.test.js .github/workflows/patch-stale-sentence-dom-test.yml
          git commit -m "Stabilize sentence translation DOM test"
          git push origin HEAD:fix/translation-response-shapes
