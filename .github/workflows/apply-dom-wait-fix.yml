name: Apply DOM wait fix

on:
  push:
    branches:
      - fix/time-based-dom-wait

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/time-based-dom-wait
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Replace fixed-iteration wait
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/reader-pending-dom.test.js')
          text = path.read_text()
          old = """async function waitFor(predicate, message = 'condition was not reached') {
            for (let attempt = 0; attempt < 100; attempt += 1) {
              if (predicate()) return;
              await flush();
            }
            assert.fail(message);
          }"""
          new = """async function waitFor(
            predicate,
            message = 'condition was not reached',
            timeoutMs = 3000
          ) {
            const deadline = Date.now() + timeoutMs;
            while (Date.now() < deadline) {
              if (predicate()) return;
              await flush();
            }
            if (predicate()) return;
            assert.fail(message);
          }"""
          if text.count(old) != 1:
              raise SystemExit(f'expected one waitFor helper, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Install dependencies
        run: npm ci
      - name: Run root test suite
        run: npm test
      - name: Run all tests
        run: npm run test:all
      - name: Commit tested patch
        shell: bash
        run: |
          rm .github/workflows/apply-dom-wait-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/reader-pending-dom.test.js .github/workflows/apply-dom-wait-fix.yml
          git commit -m "Stabilize async DOM test waits"
          git push origin HEAD:fix/time-based-dom-wait
