name: Test and deploy Cloudflare Worker

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phonetic-cards-production
  cancel-in-progress: false

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run root test suite
        run: npm test

      - name: Run all tests
        run: npm run test:all

  deploy:
    name: Migrate D1 and deploy
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Wrangler configuration
        shell: bash
        run: |
          if [[ ! -f wrangler.toml && ! -f wrangler.json && ! -f wrangler.jsonc ]]; then
            echo "::error::No Wrangler configuration file is committed. Add wrangler.toml, wrangler.json, or wrangler.jsonc before enabling production deployment."
            exit 1
          fi

      # Keep production migrations backward-compatible. Destructive schema changes
      # should be split into expand/deploy/contract releases instead of one push.
      - name: Apply remote D1 migrations
        run: npx --yes wrangler@4 d1 migrations apply DB --remote

      - name: Deploy Worker
        run: npx --yes wrangler@4 deploy
