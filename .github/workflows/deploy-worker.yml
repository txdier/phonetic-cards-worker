name: Test and deploy Cloudflare Worker

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phonetic-cards-production
  cancel-in-progress: false

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Repair stale sentence DOM test once
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/translation-response-shapes'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/reader-pending-dom.test.js')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  "&& slots[1].dataset.state === 'translated',",
                  """&& env.root.querySelectorAll(
                    '[data-role=\"sentence-translation-slot\"]'
                  )[1]?.dataset.state === 'translated',"""
              ),
              (
                  """    assert.equal(attempts.get(0), 1);
    assert.equal(attempts.get(1), 1);
    assert.equal(slots[1].dataset.state, 'translated');""",
                  """    slots = env.root.querySelectorAll('[data-role=\"sentence-translation-slot\"]');
    assert.equal(attempts.get(0), 1);
    assert.equal(attempts.get(1), 1);
    assert.equal(slots[1].dataset.state, 'translated');"""
              ),
              (
                  "() => slots[0].dataset.state === 'error',",
                  """() => env.root.querySelectorAll(
                '[data-role=\"sentence-translation-slot\"]'
              )[0]?.dataset.state === 'error',"""
              ),
              (
                  "() => attempts.get(0) === 2 && slots[0].dataset.state === 'translated',",
                  """() => attempts.get(0) === 2 && env.root.querySelectorAll(
                '[data-role=\"sentence-translation-slot\"]'
              )[0]?.dataset.state === 'translated',"""
              ),
          ]
          changed = False
          for old, new in replacements:
              count = text.count(old)
              if count == 1:
                  text = text.replace(old, new, 1)
                  changed = True
              elif count != 0:
                  raise SystemExit(f'unexpected match count {count}: {old!r}')
          if changed:
              path.write_text(text, encoding='utf-8')
          PY

          git fetch origin main
          git show origin/main:.github/workflows/deploy-worker.yml > .github/workflows/deploy-worker.yml
          rm -f .github/workflows/patch-stale-sentence-dom-test.yml

          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tests/reader-pending-dom.test.js .github/workflows/deploy-worker.yml
            git add -u .github/workflows
            git commit -m "Stabilize sentence translation DOM test"
            git push origin HEAD:fix/translation-response-shapes
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run root test suite
        run: npm test

      - name: Run all tests
        run: npm run test:all

  deploy:
    name: Migrate D1 and deploy
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Wrangler configuration
        shell: bash
        run: |
          if [[ ! -f wrangler.toml && ! -f wrangler.json && ! -f wrangler.jsonc ]]; then
            echo "::error::No Wrangler configuration file is committed. Add wrangler.toml, wrangler.json, or wrangler.jsonc before enabling production deployment."
            exit 1
          fi

      # Keep production migrations backward-compatible. Destructive schema changes
      # should be split into expand/deploy/contract releases instead of one push.
      - name: Apply remote D1 migrations
        run: npx --yes wrangler@4 d1 migrations apply DB --remote

      - name: Deploy Worker
        run: npx --yes wrangler@4 deploy
